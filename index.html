<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemel · Provident-fund tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
:root {
  --bg: oklch(0.985 0.005 85);
  --surface: oklch(1 0 0);
  --ink: oklch(0.18 0.01 85);
  --ink-2: oklch(0.32 0.01 85);
  --muted: oklch(0.55 0.005 85);
  --dim: oklch(0.7 0.005 85);
  --border: oklch(0.91 0.005 85);
  --border-strong: oklch(0.82 0.005 85);
  --accent: oklch(0.55 0.13 145);
  --pos: oklch(0.5 0.13 145);
  --loss: oklch(0.55 0.16 28);

  --pad-card: 28px;
  --gap: 20px;
  --radius: 8px;

  font-family: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
  font-feature-settings: "ss01", "cv11", "tnum";
}

[data-density="compact"] { --pad-card: 18px; --gap: 14px; }

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

.mono {
  font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-feature-settings: "tnum", "zero";
  letter-spacing: -0.005em;
}
.dim { color: var(--dim); }
.pos { color: var(--pos); }
.neg { color: var(--loss); }

.page {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 32px 80px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* Topbar */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
  margin-bottom: 4px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 6px;
  background: var(--accent);
  position: relative;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 6px;
  background: oklch(1 0 0 / 0.85);
  border-radius: 2px;
  clip-path: polygon(0 100%, 25% 60%, 50% 75%, 75% 30%, 100% 50%, 100% 100%);
}
.brand-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-2);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.status-dot[data-state="live"] { background: var(--pos); box-shadow: 0 0 0 3px oklch(0.5 0.13 145 / 0.18); }
.status-dot[data-state="closed"] { background: var(--muted); }
.divider { width: 1px; height: 14px; background: var(--border-strong); }

/* Add entry button */
.add-btn {
  background: var(--ink);
  color: oklch(0.985 0.005 85);
  border: none;
  border-radius: 5px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: -0.005em;
  display: flex;
  align-items: center;
  gap: 5px;
}
.add-btn:hover { background: var(--ink-2); }

/* Meta strip */
.meta-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.meta { padding: 18px 22px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.meta:last-child { border-right: none; }
.meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.meta-value { font-size: 15px; font-weight: 500; color: var(--ink); }
.meta-small { font-size: 11px; color: var(--muted); font-weight: 400; }

/* KPI cards */
.kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--gap); }
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--pad-card);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 8px; }
.kpi-value { font-size: 22px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
.kpi-sub { font-size: 11px; color: var(--muted); }
.kpi.pos .kpi-value { color: var(--pos); }
.kpi.neg .kpi-value { color: var(--loss); }

.pill {
  display: inline-block;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 600;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}
.pill.live, .pill.deposit { background: oklch(0.94 0.04 145); color: oklch(0.4 0.12 145); }
.pill.closed, .pill.withdrawal { background: oklch(0.94 0.04 28); color: oklch(0.45 0.14 28); }

/* Grid */
.grid-two { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--gap); }

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--pad-card);
  position: relative;
}
.card-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
.card-head.row { flex-direction: row; justify-content: space-between; align-items: flex-end; }
.card-title { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
.card-sub { font-size: 12px; color: var(--muted); }

/* Chart */
.chart { width: 100%; height: auto; display: block; user-select: none; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .axis { font-size: 10px; fill: var(--muted); font-family: "IBM Plex Mono", monospace; }
.chart .hover-line { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .flow-line { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 1 3; }
.chart .flow-dot { fill: var(--surface); stroke-width: 2; }
.chart .flow-label { font-size: 10px; fill: var(--ink-2); font-family: "IBM Plex Mono", monospace; font-weight: 500; }

.chart-card { position: relative; }
.tooltip {
  position: absolute;
  top: 60px;
  transform: translateX(-50%);
  pointer-events: none;
  background: var(--ink);
  color: oklch(0.98 0.005 85);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 11px;
  min-width: 140px;
  box-shadow: 0 4px 16px oklch(0 0 0 / 0.15);
  z-index: 10;
}
.tt-month { font-weight: 600; font-size: 12px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid oklch(0.4 0.01 85); }
.tt-row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.tt-row .pos { color: oklch(0.78 0.15 145); }
.tt-row .neg { color: oklch(0.78 0.15 28); }

/* Period panel */
.period-card { display: flex; flex-direction: column; }
.year-list { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.year-row { display: grid; grid-template-columns: 48px 1fr auto 36px 90px; align-items: center; gap: 14px; font-size: 13px; }
.year-label { font-weight: 500; }
.year-bar-wrap { height: 10px; background: oklch(0.95 0.005 85); border-radius: 2px; overflow: hidden; }
.year-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.year-profit { font-weight: 500; text-align: right; font-size: 13px; }
.year-meta { font-size: 12px; text-align: center; }
.year-flow { font-size: 12px; text-align: right; }
.period-head {
  display: grid;
  grid-template-columns: 48px 1fr auto 36px 90px;
  gap: 14px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.period-head span:nth-child(3), .period-head span:nth-child(5) { text-align: right; }
.period-head span:nth-child(4) { text-align: center; }

/* Table */
.table-wrap { overflow-x: auto; }
.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
.ledger th {
  text-align: left; font-weight: 500; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: oklch(0.99 0.003 85);
  position: sticky; top: 0;
}
.ledger th.sortable { cursor: pointer; user-select: none; }
.ledger th.sortable:hover { color: var(--ink); }
.ledger th.active { color: var(--ink); }
.ledger th .sort-arrow { margin-left: 6px; opacity: 0.4; font-size: 10px; }
.ledger th.active .sort-arrow { opacity: 1; }
.ledger td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.ledger tr:last-child td { border-bottom: none; }
.ledger tr:hover td { background: oklch(0.98 0.005 85); }
.ta-right { text-align: right; }
.ta-left { text-align: left; }

.trend { width: 80px; height: 6px; background: oklch(0.95 0.005 85); border-radius: 1px; overflow: hidden; }
.trend-bar { display: block; height: 100%; transition: width 0.3s ease; }

[data-density="compact"] .ledger td { padding: 6px 12px; }
[data-density="compact"] .ledger th { padding: 8px 12px; }
[data-density="compact"] .kpi-value { font-size: 19px; }

/* Filters */
.filters { display: flex; gap: 10px; align-items: center; }
.seg {
  display: flex;
  background: oklch(0.96 0.005 85);
  border-radius: 5px;
  padding: 2px;
  border: 1px solid var(--border);
}
.seg-btn {
  border: none; background: transparent;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 5px 12px; border-radius: 3px;
  cursor: pointer; color: var(--muted); font-family: inherit; font-weight: 500;
}
.seg-btn:hover { color: var(--ink); }
.seg-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px oklch(0 0 0 / 0.06); }
.select {
  background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
  padding: 6px 10px; font-family: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
}

/* Bar chart */
.bar.pos { fill: var(--accent); }
.bar.neg { fill: var(--loss); }

/* Footer */
.footer {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--muted);
  padding-top: 8px; border-top: 1px solid var(--border);
}

/* Multi-fund additions */
.kpis-4 { grid-template-columns: repeat(4, 1fr); }

.fund-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.fund-tab {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 20px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; font-family: inherit; text-align: left;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.fund-tab:hover { border-color: var(--border-strong); }
.fund-tab.active { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
.fund-tab-mark { width: 10px; height: 36px; border-radius: 2px; flex-shrink: 0; }
.fund-tab-meta { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.fund-tab-name {
  font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.fund-tab-hebrew { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.fund-tab-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); gap: 8px; }

.fund-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.fund-card {
  background: var(--surface); border: 1px solid var(--border);
  border-top: 3px solid var(--accent); border-radius: var(--radius);
  padding: var(--pad-card); display: flex; flex-direction: column; gap: 18px;
}
.fund-card-head { display: flex; justify-content: space-between; align-items: flex-start; }
.fund-card-name { display: flex; align-items: center; gap: 12px; }
.fund-mark { width: 28px; height: 28px; border-radius: 5px; flex-shrink: 0; }
.fund-card-title { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.fund-card-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.fund-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 24px; }
.fund-stat { display: flex; flex-direction: column; gap: 4px; }
.fund-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fund-stat-value { font-size: 17px; font-weight: 500; }
.badge-best {
  font-size: 8px; letter-spacing: 0.08em;
  background: var(--ink); color: var(--bg);
  padding: 2px 5px; border-radius: 2px;
  font-family: "IBM Plex Mono", monospace; font-weight: 600;
}

.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

.matrix-wrap { overflow-x: auto; }
.matrix { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.matrix th { font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 6px 10px; white-space: nowrap; }
.matrix th:first-child { text-align: left; }
.matrix th:not(:first-child) { text-align: right; }
.matrix .matrix-month { font-size: 12px; color: var(--ink-2); padding: 8px 10px; white-space: nowrap; font-weight: 500; }
.matrix .matrix-cell { padding: 9px 12px; text-align: right; border-radius: 4px; font-size: 12px; min-width: 110px; }
.matrix .matrix-cell.dim { background: oklch(0.97 0.005 85); color: var(--dim); }

/* Add-entry modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: oklch(0.18 0.01 85 / 0.4);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  width: 440px;
  max-width: 90vw;
  box-shadow: 0 20px 60px oklch(0 0 0 / 0.18);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 22px;
}
.modal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.modal-close {
  background: none; border: none; cursor: pointer;
  font-size: 14px; color: var(--muted); padding: 3px 7px; border-radius: 4px;
}
.modal-close:hover { background: oklch(0.96 0.005 85); color: var(--ink); }
.modal-body { display: flex; flex-direction: column; gap: 16px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
.form-input {
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 6px; padding: 9px 12px;
  font-family: inherit; font-size: 14px; color: var(--ink);
  outline: none; width: 100%;
  transition: border-color 0.1s, box-shadow 0.1s;
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.55 0.13 145 / 0.12); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-seg { display: flex; background: oklch(0.96 0.005 85); border-radius: 6px; border: 1px solid var(--border); padding: 2px; }
.form-seg-btn {
  flex: 1; border: none; background: transparent; padding: 7px 10px;
  font-family: inherit; font-size: 12px; border-radius: 4px; cursor: pointer;
  color: var(--muted); font-weight: 500;
}
.form-seg-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px oklch(0 0 0 / 0.06); }
.btn-submit {
  background: var(--ink); color: oklch(0.985 0.005 85);
  border: none; border-radius: 6px; padding: 11px 20px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; width: 100%; margin-top: 4px;
}
.btn-submit:hover { background: var(--ink-2); }
.btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }
.form-error { font-size: 12px; color: var(--loss); background: oklch(0.96 0.04 28); padding: 9px 12px; border-radius: 5px; }
.form-hint { font-size: 11px; color: var(--muted); }
.api-key-banner {
  background: oklch(0.97 0.005 85); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 14px;
  font-size: 12px; color: var(--ink-2);
  display: flex; flex-direction: column; gap: 6px;
}
.api-key-banner code {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  color: var(--ink); background: var(--surface);
  padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border);
}

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .grid-two { grid-template-columns: 1fr; }
  .meta-strip { grid-template-columns: repeat(2, 1fr); }
  .meta:nth-child(odd) { border-right: 1px solid var(--border); }
  .meta { border-bottom: 1px solid var(--border); }
  .kpis-4 { grid-template-columns: repeat(2, 1fr); }
  .fund-tabs { grid-template-columns: repeat(2, 1fr); }
  .fund-cards { grid-template-columns: 1fr; }
}
  </style>
</head>

// ─── DATA PROCESSING ──────────────────────────────────────────────────────────

function buildSeries(raw) {
  let prev = null;
  return raw.map((row) => {
    const flow = row.flow || 0;
    let profit = null, pct = null;
    if (prev !== null && row.price !== 0) {
      profit = row.price - prev - flow;
      const base = prev + Math.max(flow, 0);
      pct = base > 0 ? (profit / base) * 100 : null;
    } else if (prev !== null && row.price === 0 && flow < 0) {
      profit = 0; pct = 0;
    } else if (prev === null && flow > 0 && row.price > 0) {
      profit = row.price - flow; pct = null;
    }
    prev = row.price === 0 ? prev : row.price;
    return { ...row, profit, pct, flow };
  });
}

function computeSummary(series) {
  const active = series.filter(r => r.price > 0);
  const last = active[active.length - 1] || { price: 0 };
  const totalDeposited = series.reduce((s, r) => s + (r.flow > 0 ? r.flow : 0), 0);
  const totalWithdrawn = series.reduce((s, r) => s + (r.flow < 0 ? -r.flow : 0), 0);
  const totalProfit = series.reduce((s, r) => s + (r.profit || 0), 0);
  const peak = active.reduce((m, r) => Math.max(m, r.price), 0);
  const peakRow = active.find(r => r.price === peak);
  const months = active.length - 1;
  const totalReturn = totalDeposited > 0 ? (totalProfit / totalDeposited) * 100 : 0;
  const annualized = totalDeposited > 0 && months > 0
    ? (Math.pow(1 + totalProfit / totalDeposited, 12 / months) - 1) * 100 : 0;
  const gains = active.slice(1).filter(r => (r.profit || 0) > 0).length;
  const losses = active.slice(1).filter(r => (r.profit || 0) < 0).length;
  const profitMonths = active.slice(1).filter(r => r.profit !== null && (r.flow || 0) === 0);
  const bestMonth = profitMonths.reduce((b, r) => (b === null || (r.pct || -Infinity) > b.pct ? r : b), null);
  const worstMonth = profitMonths.reduce((b, r) => (b === null || (r.pct || Infinity) < b.pct ? r : b), null);
  return {
    currentValue: last.price, isClosed: totalWithdrawn > 0,
    finalValueBeforeClose: totalWithdrawn || last.price,
    totalDeposited, totalWithdrawn, totalProfit, totalReturn, annualized,
    peak, peakDate: peakRow?.date, months, gains, losses, bestMonth, worstMonth,
  };
}

function buildPortfolio(funds) {
  const allDates = Array.from(new Set(funds.flatMap(f => f.series.map(r => r.date)))).sort();
  const series = allDates.map(date => {
    let price = 0, profit = 0, flow = 0;
    funds.forEach(f => {
      const row = f.series.find(r => r.date === date);
      if (row) { price += row.price; profit += row.profit || 0; flow += row.flow || 0; }
    });
    const note = flow > 0 ? "deposit" : flow < 0 ? "withdrawal" : null;
    return { date, price, profit, flow, note, pct: null };
  });
  let prev = null;
  series.forEach(r => {
    if (prev !== null && r.price > 0) {
      const base = prev + Math.max(r.flow, 0);
      r.pct = base > 0 ? (r.profit / base) * 100 : null;
    } else if (prev !== null && r.price === 0) { r.pct = 0; }
    prev = r.price === 0 ? prev : r.price;
  });
  return {
    id: "all", name: "All funds", short: "Portfolio", hebrew: "כל הקרנות",
    accent: "oklch(0.22 0.005 85)", series, summary: computeSummary(series),
  };
}

function buildFunds(metaList) {
  const funds = metaList.map(m => ({ ...m, series: buildSeries(m.raw) }));
  funds.forEach(f => { f.summary = computeSummary(f.series); });
  return funds;
}

function fmtILS(n, opts = {}) {
  const { sign = false, decimals = 0 } = opts;
  if (n === null || n === undefined || isNaN(n)) return "—";
  const s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return `${n < 0 ? "−" : sign ? "+" : ""}₪${s}`;
}
function fmtPct(n, opts = {}) {
  const { sign = true, decimals = 2 } = opts;
  if (n === null || n === undefined || isNaN(n)) return "—";
  return `${n < 0 ? "−" : sign ? "+" : ""}${Math.abs(n).toFixed(decimals)}%`;
}
function fmtMonth(d) {
  return new Date(d).toLocaleString("en-US", { month: "short", year: "numeric" });
}
function fmtMonthShort(d) {
  const dt = new Date(d);
  return dt.toLocaleString("en-US", { month: "short" }) + " '" + String(dt.getFullYear()).slice(2);
}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clamp = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const maxRight = Math.max(PAD, window.innerWidth - panel.offsetWidth - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - panel.offsetHeight - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clamp();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clamp) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clamp);
    return () => window.removeEventListener('resize', clamp);
  }, [open, clamp]);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const sx = e.clientX, sy = e.clientY;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clamp();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()}
                  onClick={() => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (trackRef.current) { const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); } };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const key = o => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  const isLight = (hex) => {
    const h = String(hex).replace('#', '');
    const x = h.length === 3 ? h.replace(/./g, c => c + c) : h.padEnd(6, '0');
    const n = parseInt(x.slice(0, 6), 16);
    if (isNaN(n)) return true;
    return ((n >> 16) & 255) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114 > 148000;
  };
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const hero = Array.isArray(o) ? o[0] : o;
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on ? '1' : '0'}
                    style={{ background: hero }} onClick={() => onChange(o)}>
              {on && (
                <svg viewBox="0 0 14 14"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
                  strokeLinecap="round" strokeLinejoin="round" stroke={isLight(hero) ? 'rgba(0,0,0,.78)' : '#fff'} /></svg>
              )}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function EquityChart({ series, accent, height = 360 }) {
  const [hover, setHover] = React.useState(null);
  const ref = React.useRef(null);

  const active = series.filter(r => r.price > 0);
  const w = 1100, h = height;
  const pad = { t: 24, r: 28, b: 36, l: 76 };

  const min = Math.min(...active.map(r => r.price)) * 0.95;
  const max = Math.max(...active.map(r => r.price)) * 1.04;
  const xs = active.map((_, i) => pad.l + (i / (active.length - 1)) * (w - pad.l - pad.r));
  const ys = active.map(r => pad.t + (1 - (r.price - min) / (max - min)) * (h - pad.t - pad.b));

  const pathD = active.map((_, i) => `${i === 0 ? "M" : "L"}${xs[i]},${ys[i]}`).join(" ");
  const areaD = `${pathD} L${xs[xs.length - 1]},${h - pad.b} L${xs[0]},${h - pad.b} Z`;
  const tickVals = Array.from({ length: 5 }, (_, i) => min + (i / 4) * (max - min));
  const xTicks = active.map((r, i) => ({ i, label: fmtMonthShort(r.date) })).filter(t => t.i % 2 === 0);

  function onMove(e) {
    const rect = ref.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * w;
    let best = 0, bestDist = Infinity;
    xs.forEach((xv, i) => { const d = Math.abs(xv - x); if (d < bestDist) { bestDist = d; best = i; } });
    setHover(best);
  }

  const flows = active.map((r, i) => ({ ...r, x: xs[i], y: ys[i] })).filter(r => r.flow);

  return (
    <div className="card chart-card">
      <div className="card-head">
        <div className="card-title">Equity curve</div>
        <div className="card-sub">Fund value over time · ₪</div>
      </div>
      <svg ref={ref} viewBox={`0 0 ${w} ${h}`} className="chart"
           onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="equity-fill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor={accent} stopOpacity="0.18" />
            <stop offset="100%" stopColor={accent} stopOpacity="0" />
          </linearGradient>
        </defs>
        {tickVals.map((v, i) => {
          const y = pad.t + (1 - (v - min) / (max - min)) * (h - pad.t - pad.b);
          return <g key={i}>
            <line x1={pad.l} x2={w - pad.r} y1={y} y2={y} className="grid" />
            <text x={pad.l - 12} y={y + 4} className="axis" textAnchor="end">{(v / 1000).toFixed(0)}k</text>
          </g>;
        })}
        {xTicks.map(t => <text key={t.i} x={xs[t.i]} y={h - pad.b + 22} className="axis" textAnchor="middle">{t.label}</text>)}
        <path d={areaD} fill="url(#equity-fill)" />
        <path d={pathD} fill="none" stroke={accent} strokeWidth="2.25" strokeLinejoin="round" strokeLinecap="round" />
        {flows.map((f, i) => (
          <g key={i}>
            <line x1={f.x} x2={f.x} y1={pad.t} y2={h - pad.b} className="flow-line" />
            <circle cx={f.x} cy={f.y} r="6" className="flow-dot" stroke={accent} />
            <text x={f.x} y={pad.t - 8} className="flow-label" textAnchor="middle">
              {f.flow > 0 ? "+" : "−"}₪{(Math.abs(f.flow) / 1000).toFixed(1)}k
            </text>
          </g>
        ))}
        {hover !== null && <>
          <line x1={xs[hover]} x2={xs[hover]} y1={pad.t} y2={h - pad.b} className="hover-line" />
          <circle cx={xs[hover]} cy={ys[hover]} r="5" fill={accent} stroke="var(--bg)" strokeWidth="2" />
        </>}
      </svg>
      {hover !== null && (
        <div className="tooltip" style={{ left: `${(xs[hover] / w) * 100}%` }}>
          <div className="tt-month">{fmtMonth(active[hover].date)}</div>
          <div className="tt-row"><span>Value</span><span className="mono">{fmtILS(active[hover].price)}</span></div>
          <div className="tt-row">
            <span>Δ</span>
            <span className={"mono " + (active[hover].profit > 0 ? "pos" : active[hover].profit < 0 ? "neg" : "")}>
              {active[hover].profit !== null ? fmtILS(active[hover].profit, { sign: true }) : "—"}
            </span>
          </div>
          <div className="tt-row">
            <span>%</span>
            <span className={"mono " + (active[hover].pct > 0 ? "pos" : active[hover].pct < 0 ? "neg" : "")}>
              {fmtPct(active[hover].pct)}

            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const maxAbs = Math.max(...data.map(r => Math.abs(r.profit || 0)));
  const yZero = pad.t + inner.h / 2;
  const step = (w - pad.l - pad.r) / data.length;

        {data.map((r, i) => {

// ─── TABLE ────────────────────────────────────────────────────────────────────

function DataTable({ series, accent }) {
  const [sortKey, setSortKey] = React.useState("date");
  const [sortDir, setSortDir] = React.useState("asc");
  const [filter, setFilter] = React.useState("all");
  const [yearFilter, setYearFilter] = React.useState("all");

  const years = ["all", ...Array.from(new Set(series.map(r => r.date.slice(0, 4))))];
  let rows = series.filter(r => {
    if (yearFilter !== "all" && !r.date.startsWith(yearFilter)) return false;
    if (filter === "gains") return (r.profit || 0) > 0;
    if (filter === "losses") return (r.profit || 0) < 0;
    if (filter === "flows") return !!r.flow;
    return true;
  });
  rows = [...rows].sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    if (va === null || va === undefined) return 1;
    if (vb === null || vb === undefined) return -1;
    if (va < vb) return sortDir === "asc" ? -1 : 1;
    if (va > vb) return sortDir === "asc" ? 1 : -1;
    return 0;
  });

  function clickSort(key) {
    if (sortKey === key) setSortDir(sortDir === "asc" ? "desc" : "asc");
    else { setSortKey(key); setSortDir(key === "date" ? "asc" : "desc"); }
  }

  function SortHead({ k, children, align = "left" }) {
    const active = sortKey === k;
    return (
      <th onClick={() => clickSort(k)} className={"sortable " + (active ? "active " : "") + "ta-" + align}>
        <span>{children}</span>
        <span className="sort-arrow">{active ? (sortDir === "asc" ? "↑" : "↓") : "↕"}</span>
      </th>
    );
  }

  const maxAbsPct = Math.max(0.01, ...series.map(r => Math.abs(r.pct || 0)));

  return (
    <div className="card">
      <div className="card-head row">
        <div>
          <div className="card-title">Monthly ledger</div>
          <div className="card-sub">{rows.length} {rows.length === 1 ? "row" : "rows"} · click any header to sort</div>
        </div>
        <div className="filters">
          <div className="seg">
            {["all", "gains", "losses", "flows"].map(f => (
              <button key={f} className={"seg-btn " + (filter === f ? "active" : "")} onClick={() => setFilter(f)}>{f}</button>
            ))}
          </div>
          <select className="select" value={yearFilter} onChange={e => setYearFilter(e.target.value)}>
            {years.map(y => <option key={y} value={y}>{y === "all" ? "All years" : y}</option>)}
          </select>
        </div>
      </div>
      <div className="table-wrap">
        <table className="ledger">
          <thead>
            <tr>
              <SortHead k="date">Month</SortHead>
              <SortHead k="price" align="right">Price</SortHead>
              <SortHead k="profit" align="right">Profit</SortHead>
              <SortHead k="pct" align="right">%</SortHead>
              <th className="ta-left">Trend</th>
              <th className="ta-right">Flow</th>
              <th className="ta-left">Note</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => {
              const pos = (r.profit || 0) > 0, neg = (r.profit || 0) < 0;
              const trendW = r.pct !== null ? (Math.abs(r.pct) / maxAbsPct) * 100 : 0;
              return (
                <tr key={r.date}>
                  <td>{fmtMonth(r.date)}</td>
                  <td className="mono ta-right">{r.price > 0 ? fmtILS(r.price) : <span className="dim">—</span>}</td>
                  <td className={"mono ta-right " + (pos ? "pos" : neg ? "neg" : "dim")}>
                    {r.profit !== null ? fmtILS(r.profit, { sign: true }) : "—"}
                  </td>
                  <td className={"mono ta-right " + (pos ? "pos" : neg ? "neg" : "dim")}>{fmtPct(r.pct)}</td>
                  <td className="ta-left">
                    {r.pct !== null && r.pct !== 0
                      ? <div className="trend"><span className="trend-bar" style={{ width: trendW + "%", background: pos ? accent : "var(--loss)" }}></span></div>
                      : <span className="dim">—</span>}
                  </td>
                  <td className="mono ta-right">
                    {r.flow ? <span className={r.flow > 0 ? "pos" : "neg"}>{fmtILS(r.flow, { sign: true })}</span> : <span className="dim">—</span>}
                  </td>
                  <td>{r.note ? <span className={"pill " + r.note}>{r.note}</span> : <span className="dim">—</span>}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── COMPARISON ───────────────────────────────────────────────────────────────

function ComparisonChart({ funds, mode }) {
  const [hover, setHover] = React.useState(null);
  const ref = React.useRef(null);
  const w = 1100, h = 380;
  const pad = { t: 28, r: 28, b: 40, l: 76 };
  const allDates = Array.from(new Set(funds.flatMap(f => f.series.map(r => r.date)))).sort();

  const lines = funds.map(f => {
    const active = f.series.filter(r => r.price > 0);
    if (!active.length) return { id: f.id, name: f.name, accent: f.accent, short: f.short, points: [] };
    const points = [];
    let cumFlow = 0;
    f.series.forEach(r => {
      if (r.price === 0) return;
      cumFlow += r.flow || 0;
      const val = mode === "indexed"
        ? ((r.price - cumFlow) / (active[0].flow || active[0].price)) * 100
        : r.price;
      points.push({ date: r.date, value: val });
    });
    return { id: f.id, name: f.name, accent: f.accent, short: f.short, points };
  });

  const allVals = lines.flatMap(l => l.points.map(p => p.value));
  const min = mode === "indexed" ? Math.min(0, ...allVals) - 5 : Math.min(...allVals) * 0.95;
  const max = mode === "indexed" ? Math.max(...allVals) + 5 : Math.max(...allVals) * 1.04;
  const xOf = d => pad.l + (allDates.indexOf(d) / (allDates.length - 1)) * (w - pad.l - pad.r);
  const yOf = v => pad.t + (1 - (v - min) / (max - min)) * (h - pad.t - pad.b);
  const tickVals = Array.from({ length: 6 }, (_, i) => min + (i / 5) * (max - min));
  const xTicks = allDates.filter((_, i) => i % 2 === 0);

  function onMove(e) {
    const rect = ref.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * w;
    let bestDate = null, bestDist = Infinity;
    allDates.forEach(d => { const dist = Math.abs(xOf(d) - x); if (dist < bestDist) { bestDist = dist; bestDate = d; } });
    setHover(bestDate);
  }

  return (
    <div className="card chart-card">
      <div className="card-head row">
        <div>
          <div className="card-title">Fund comparison</div>
          <div className="card-sub">{mode === "indexed" ? "Performance indexed (deposits-neutral, %)" : "Raw price (₪)"}</div>
        </div>
        <div className="legend">
          {lines.map(l => (
            <div key={l.id} className="legend-item">
              <span className="legend-dot" style={{ background: l.accent }}></span>
              <span>{l.short}</span>
            </div>
          ))}
        </div>
      </div>
      <svg ref={ref} viewBox={`0 0 ${w} ${h}`} className="chart" onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        {tickVals.map((v, i) => {
          const y = yOf(v);
          return <g key={i}>
            <line x1={pad.l} x2={w - pad.r} y1={y} y2={y} className="grid" />
            <text x={pad.l - 12} y={y + 4} className="axis" textAnchor="end">
              {mode === "indexed" ? v.toFixed(0) + "%" : (v / 1000).toFixed(0) + "k"}
            </text>
          </g>;
        })}
        {xTicks.map(d => <text key={d} x={xOf(d)} y={h - pad.b + 22} className="axis" textAnchor="middle">{fmtMonthShort(d)}</text>)}
        {mode === "indexed" && <line x1={pad.l} x2={w - pad.r} y1={yOf(0)} y2={yOf(0)} className="grid" stroke="var(--border-strong)" />}
        {lines.map(l => {
          const d = l.points.map((p, i) => `${i === 0 ? "M" : "L"}${xOf(p.date)},${yOf(p.value)}`).join(" ");
          return <path key={l.id} d={d} fill="none" stroke={l.accent} strokeWidth="2.25" strokeLinejoin="round" strokeLinecap="round" />;
        })}
        {hover && <>
          <line x1={xOf(hover)} x2={xOf(hover)} y1={pad.t} y2={h - pad.b} className="hover-line" />
          {lines.map(l => { const p = l.points.find(pt => pt.date === hover); return p ? <circle key={l.id} cx={xOf(p.date)} cy={yOf(p.value)} r="5" fill={l.accent} stroke="var(--bg)" strokeWidth="2" /> : null; })}
        </>}
      </svg>
      {hover && (
        <div className="tooltip" style={{ left: `${(xOf(hover) / w) * 100}%` }}>
          <div className="tt-month">{fmtMonth(hover)}</div>
          {lines.map(l => {
            const p = l.points.find(pt => pt.date === hover);
            return (
              <div key={l.id} className="tt-row">
                <span><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: l.accent, marginRight: 5, verticalAlign: 'middle' }}></span>{l.short}</span>
                <span className="mono">{p ? (mode === "indexed" ? fmtPct(p.value) : fmtILS(p.value)) : "—"}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MonthlyMatrix({ funds }) {
  const allDates = Array.from(new Set(funds.flatMap(f => f.series.map(r => r.date)))).sort();
  const monthsWithAny = allDates.filter(d => funds.some(f => {
    const r = f.series.find(x => x.date === d);
    return r && r.price > 0 && r.profit !== null && !r.flow;
  }));
  const allPcts = funds.flatMap(f => f.series.filter(r => r.profit !== null && !r.flow).map(r => r.pct));
  const maxAbs = Math.max(...allPcts.map(Math.abs));

  function cellStyle(pct) {
    if (pct === null || pct === undefined) return {};
    const intensity = Math.min(1, Math.abs(pct) / maxAbs);
    const lightness = 0.97 - intensity * 0.32;
    if (pct >= 0) return { background: `oklch(${lightness} ${0.06 + intensity * 0.1} 145)`, color: intensity > 0.55 ? "white" : "var(--ink)" };
    return { background: `oklch(${lightness} ${0.06 + intensity * 0.1} 28)`, color: intensity > 0.55 ? "white" : "var(--ink)" };
  }

  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">Monthly returns matrix</div>
        <div className="card-sub">Each cell = that fund's % for that month · darker = larger move</div>
      </div>
      <div className="matrix-wrap">
        <table className="matrix">
          <thead>
            <tr>
              <th className="ta-left">Month</th>
              {funds.map(f => (
                <th key={f.id} className="ta-right">
                  <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%', background: f.accent, marginRight: 5, verticalAlign: 'middle' }}></span>
                  {f.short}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {monthsWithAny.map(d => (
              <tr key={d}>
                <td className="matrix-month">{fmtMonth(d)}</td>
                {funds.map(f => {
                  const r = f.series.find(x => x.date === d);
                  if (!r || r.price === 0) return <td key={f.id} className="matrix-cell dim">—</td>;
                  if (r.flow) return <td key={f.id} className="matrix-cell"><span className={"pill " + (r.flow > 0 ? "deposit" : "withdrawal")}>{r.flow > 0 ? "+" : "−"}₪{(Math.abs(r.flow) / 1000).toFixed(0)}k</span></td>;
                  return <td key={f.id} className="matrix-cell mono" style={cellStyle(r.pct)}>{fmtPct(r.pct, { decimals: 2 })}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── ADD ENTRY MODAL ──────────────────────────────────────────────────────────

function AddEntryModal({ funds, onClose, onSuccess }) {
  const [fundId, setFundId] = React.useState(funds[0]?.id || '');
  const [month, setMonth] = React.useState('');
  const [price, setPrice] = React.useState('');
  const [type, setType] = React.useState('normal'); // normal | deposit | withdrawal
  const [flow, setFlow] = React.useState('');
  const [apiKey, setApiKey] = React.useState(() => localStorage.getItem('gemel_api_key') || '');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  async function submit(e) {
    e.preventDefault();
    if (!month) return setError('Please select a month.');
    if (!price && type !== 'withdrawal') return setError('Price is required.');
    setLoading(true);
    setError('');

    if (apiKey) localStorage.setItem('gemel_api_key', apiKey);

    const date = month + '-01';
    const body = { date, price: type === 'withdrawal' ? 0 : Number(price) };
    if (type === 'deposit') { body.note = 'deposit'; body.flow = Math.abs(Number(flow)) || 0; }
    if (type === 'withdrawal') { body.note = 'withdrawal'; body.flow = -(Math.abs(Number(price)) || 0); body.price = 0; }

    try {
      const resp = await fetch(`/api/funds/${fundId}/entries`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Server error');
      onSuccess();
      onClose();
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <span className="modal-title">Add monthly entry</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <form className="modal-body" onSubmit={submit}>
          <div className="form-row">
            <div className="form-field">
              <label className="form-label">Fund</label>
              <select className="form-input" value={fundId} onChange={e => setFundId(e.target.value)}>
                {funds.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
              </select>
            </div>
            <div className="form-field">
              <label className="form-label">Month</label>
              <input type="month" className="form-input" value={month} onChange={e => setMonth(e.target.value)} />
            </div>
          </div>

          <div className="form-field">
            <label className="form-label">Entry type</label>
            <div className="form-seg">
              {[['normal','Normal'],['deposit','Deposit'],['withdrawal','Full withdrawal']].map(([v,l]) => (
                <button key={v} type="button" className={"form-seg-btn " + (type === v ? "active" : "")}
                        onClick={() => setType(v)}>{l}</button>
              ))}
            </div>
          </div>

          {type !== 'withdrawal' && (
            <div className="form-field">
              <label className="form-label">Fund value (₪)</label>
              <input type="number" className="form-input mono" placeholder="e.g. 195000"
                     value={price} onChange={e => setPrice(e.target.value)} min="0" />
              <span className="form-hint">Total fund value at end of month</span>
            </div>
          )}

          {type === 'deposit' && (
            <div className="form-field">
              <label className="form-label">Amount deposited (₪)</label>
              <input type="number" className="form-input mono" placeholder="e.g. 50000"
                     value={flow} onChange={e => setFlow(e.target.value)} min="0" />
            </div>
          )}

          {type === 'withdrawal' && (
            <div className="form-field">
              <label className="form-label">Amount withdrawn (₪)</label>
              <input type="number" className="form-input mono" placeholder="Total amount received"
                     value={price} onChange={e => setPrice(e.target.value)} min="0" />
            </div>
          )}

          <div className="form-field">
            <label className="form-label">API key</label>
            <input type="password" className="form-input mono" placeholder="Shown in server console on startup"
                   value={apiKey} onChange={e => setApiKey(e.target.value)} />
            <span className="form-hint">Saved in your browser after first use</span>
          </div>

          {error && <div className="form-error">{error}</div>}
          <button type="submit" className="btn-submit" disabled={loading}>
            {loading ? 'Saving…' : 'Add entry'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────

function App() {
  const [t, setTweak] = useTweaks({ accent: "#1f7a4a", density: "comfortable", compareMode: "indexed" });
  const [view, setView] = React.useState("all");
  const [funds, setFunds] = React.useState(FALLBACK_FUNDS);
  const [portfolio, setPortfolio] = React.useState(FALLBACK_PORTFOLIO);
  const [apiAvailable, setApiAvailable] = React.useState(false);
  const [showAddModal, setShowAddModal] = React.useState(false);

  const accentMap = {
    "#1f7a4a": "oklch(0.55 0.13 145)",
    "#2a5fb8": "oklch(0.55 0.13 250)",
    "#a04a1b": "oklch(0.55 0.13 50)",
    "#181818": "oklch(0.22 0.005 85)",
  };
  const isAll = view === "all";
  const fund = isAll ? null : funds.find(f => f.id === view);
  const defaultAccent = accentMap[t.accent] || t.accent;
  const accent = isAll ? defaultAccent : (fund?.accent || defaultAccent);

  React.useEffect(() => {
    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.dataset.density = t.density;
  }, [accent, t.density]);

  const loadFromApi = React.useCallback(async (signal) => {
    try {
      const resp = await fetch('/api/funds', signal ? { signal } : {});
      if (!resp.ok) return false;
      const data = await resp.json();
      const f = buildFunds(data.funds);
      const p = buildPortfolio(f);
      setFunds(f);
      setPortfolio(p);
      return true;
    } catch (e) {
      return false;
    }
  }, []);

  React.useEffect(() => {
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = controller ? setTimeout(() => controller.abort(), 2500) : null;
    loadFromApi(controller?.signal).then(ok => {
      if (ok) setApiAvailable(true);
    });
    return () => { if (timer) clearTimeout(timer); if (controller) controller.abort(); };
  }, [loadFromApi]);

  const reload = React.useCallback(() => loadFromApi(), [loadFromApi]);

  const firstDate = portfolio.series[0]?.date;
  const lastActive = portfolio.series.filter(s => s.price > 0).slice(-1)[0];
  const lastDate = lastActive?.date || portfolio.series.slice(-1)[0]?.date;

  return (
    <div className="page">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark" style={{ background: accent }}></div>
          <div>
            <div className="brand-title">Gemel · Provident-fund tracker</div>
            <div className="brand-sub">{funds.length} funds · {fmtMonth(firstDate)} → {fmtMonth(lastDate)}</div>
          </div>
        </div>
        <div className="topbar-right">
          <span className="status-dot" data-state="closed"></span>
          <span>All closed Jun 2026</span>
          <span className="divider"></span>
          <span className="mono dim">ILS · ₪</span>
          {apiAvailable && <>
            <span className="divider"></span>
            <button className="add-btn" onClick={() => setShowAddModal(true)}>+ Add entry</button>
          </>}
        </div>
      </header>

      {/* Fund tabs */}
      <div className="fund-tabs">
        {[
          { id: "all", short: "All funds", hebrew: "סך הכל", accent: "var(--ink)",
            value: portfolio.summary.finalValueBeforeClose, ret: portfolio.summary.totalReturn },
          ...funds.map(f => ({ id: f.id, short: f.short, hebrew: f.hebrew, accent: f.accent,
            value: f.summary.finalValueBeforeClose, ret: f.summary.totalReturn })),
        ].map(item => (
          <button key={item.id} className={"fund-tab " + (view === item.id ? "active" : "")} onClick={() => setView(item.id)}>
            <span className="fund-tab-mark" style={{ background: item.accent }}></span>
            <div className="fund-tab-meta">
              <div className="fund-tab-name">{item.short}<span className="fund-tab-hebrew">{item.hebrew}</span></div>
              <div className="fund-tab-stats">
                <span className="mono">{fmtILS(item.value)}</span>
                <span className={"mono " + (item.ret >= 0 ? "pos" : "neg")}>{fmtPct(item.ret)}</span>
              </div>
            </div>
          </button>
        ))}
      </div>

      {isAll ? (
        <>
          <PortfolioKPIs portfolio={portfolio} funds={funds} />
          <ComparisonChart funds={funds} mode={t.compareMode} />
          <FundCompareCards funds={funds} />
          <MonthlyMatrix funds={funds} />
        </>
      ) : fund ? (
        <>
          <MetaStrip summary={fund.summary} fundName={fund.name + " · " + fund.hebrew} />
          <KPICards summary={fund.summary} />
          <div className="grid-two">
            <EquityChart series={fund.series} accent={accent} />
            <PeriodPanel series={fund.series} accent={accent} />
          </div>
          <ReturnsBars series={fund.series} accent={accent} />
          <DataTable series={fund.series} accent={accent} />
        </>
      ) : null}

      <footer className="footer">
        <div>{portfolio.series.length} months · {funds.length} funds · last activity {fmtMonth(lastDate)}</div>
        <div className="dim">{apiAvailable ? "Connected to server · data is live" : "Offline mode · open via server for live data"}</div>
      </footer>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Display">
          <TweakRadio label="Density" value={t.density} options={["comfortable", "compact"]} onChange={v => setTweak("density", v)} />
          <TweakRadio label="Comparison" value={t.compareMode} options={["indexed", "value"]} onChange={v => setTweak("compareMode", v)} />
        </TweakSection>
        <TweakSection label="Default accent">
          <TweakColor label="Accent" value={t.accent} options={["#1f7a4a", "#2a5fb8", "#a04a1b", "#181818"]} onChange={v => setTweak("accent", v)} />
        </TweakSection>
      </TweaksPanel>

      {showAddModal && (
        <AddEntryModal funds={funds} onClose={() => setShowAddModal(false)} onSuccess={reload} />
      )}
    </div>
  );
}

function PeriodPanel({ series, accent }) {
  const byYear = {};
  series.forEach(r => {
    if (r.price === 0 && !r.flow) return;
    const y = r.date.slice(0, 4);
    if (!byYear[y]) byYear[y] = { profit: 0, flows: 0, gains: 0, losses: 0 };
    byYear[y].profit += r.profit || 0;
    byYear[y].flows += r.flow || 0;
    if (r.profit !== null && r.price > 0 && !r.flow) {
      if (r.profit > 0) byYear[y].gains++;
      if (r.profit < 0) byYear[y].losses++;
    }
  });
  const years = Object.keys(byYear).sort();
  const maxProfit = Math.max(1, ...years.map(y => Math.abs(byYear[y].profit)));

  return (
    <div className="card period-card">
      <div className="card-head"><div className="card-title">By year</div><div className="card-sub">Profit and cash flow per calendar year</div></div>
      <div className="year-list">
        {years.map(y => {
          const d = byYear[y];
          const pos = d.profit >= 0;
          return (
            <div key={y} className="year-row">
              <div className="year-label">{y}</div>
              <div className="year-bar-wrap"><div className="year-bar" style={{ width: (Math.abs(d.profit) / maxProfit) * 100 + "%", background: pos ? accent : "var(--loss)" }}></div></div>
              <div className={"year-profit mono " + (pos ? "pos" : "neg")}>{fmtILS(d.profit, { sign: true })}</div>
              <div className="year-meta"><span className="pos">{d.gains}</span><span className="dim">/</span><span className="neg">{d.losses}</span></div>
              <div className="year-flow mono">
                {d.flows ? <span className={d.flows > 0 ? "pos" : "neg"}>{fmtILS(d.flows, { sign: true })}</span> : <span className="dim">—</span>}
              </div>
            </div>
          );
        })}
      </div>
      <div className="period-head"><span>Year</span><span></span><span>Profit</span><span>G/L</span><span>Flow</span></div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
